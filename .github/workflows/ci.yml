name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18.18', '20', '22']

    defaults:
      run:
        working-directory: plugins/cursor

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/cursor/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # The main matrix has no Windows runner and most of the suite assumes POSIX
  # paths, so this job runs only the cursor-agent launch tests, which spawn a
  # real node.exe through the installer layout (#27).
  windows-bin:
    name: windows-latest / node 22 / cursor-agent launch
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: plugins/cursor

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/cursor/package-lock.json

      - run: npm ci

      - name: Test
        run: npx vitest run tests/windows-bin.test.mjs
